<fieldset class="cbi-section smartdns-status-section" aria-live="polite">
	<p id="smartdns-status"><%:Collecting data ...%></p>
</fieldset>
<script type="text/javascript">
XHR.poll(2, '<%=luci.dispatcher.build_url("admin", "services", "smartdns", "status")%>', null,
	function(xhr, data) {
		var node = document.getElementById('smartdns-status');
		if (node && data) {
			node.textContent = 'SmartDNS-rs - ' + (data.running ? '<%:RUNNING%>' : '<%:NOT RUNNING%>');
			node.style.color = data.running ? 'green' : 'red';
		}
	});
</script>
