name: OpenWrt IPK probe

on:
  push:
    branches:
      - feat/openwrt-ipk-packages
    paths:
      - ".github/workflows/openwrt-ipk-probe.yml"

permissions:
  contents: read

jobs:
  sdk:
    name: OpenWrt 24.10 SDK (aarch64_cortex-a53)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow the OpenWrt 24.10 Rust toolchain
        shell: bash
        run: |
          sed -i '/CARGO_PKG_ARGS+=--no-default-features/a CARGO_PKG_ARGS+=--ignore-rust-version' \
            contrib/openwrt/smartdns-rs/Makefile

      - name: Build IPK packages
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: aarch64_cortex-a53-24.10.7
          BUILD_LOG: 1
          NO_REFRESH_CHECK: 1
          PACKAGES: smartdns-rs luci-app-smartdns-rs
          V: s

      - name: Upload packages and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipk-probe-${{ github.sha }}
          path: |
            bin/packages/**/*.ipk
            logs/**
          if-no-files-found: error
          retention-days: 3
