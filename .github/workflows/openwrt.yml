name: OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after every architecture succeeds
        required: true
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "include/**"
      - "src/**"
      - "contrib/openwrt/**"
      - ".github/workflows/openwrt.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "include/**"
      - "src/**"
      - "contrib/openwrt/**"
      - ".github/workflows/openwrt.yml"

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Rust/UCI/LuCI contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y gettext shellcheck

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust_toolchain: stable
          install_cross: "false"
          install_wix: "false"
          install_cargo_edit: "false"

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check interface contract
        run: |
          python3 contrib/openwrt/tests/check_contract.py
          sh contrib/openwrt/tests/generate_config.sh
          sh contrib/openwrt/tests/dnsmasq_state.sh

      - name: Check shell
        run: |
          shellcheck -s sh \
            contrib/openwrt/files/etc/init.d/smartdns \
            contrib/openwrt/files/etc/uci-defaults/90-smartdns-rs \
            contrib/openwrt/luci-app-smartdns-rs/root/usr/libexec/smartdns-rs-call \
            contrib/openwrt/tests/generate_config.sh \
            contrib/openwrt/tests/dnsmasq_state.sh

      - name: Check LuCI JavaScript and translations
        run: |
          node --check contrib/openwrt/luci-app-smartdns-rs/htdocs/luci-static/resources/view/smartdns/smartdns.js
          node --check contrib/openwrt/luci-app-smartdns-rs/htdocs/luci-static/resources/view/smartdns/log.js
          msgfmt --check --output-file=/dev/null contrib/openwrt/luci-app-smartdns-rs/po/zh_Hans/smartdns-rs.po

      - name: Test Rust compatibility parser
        run: cargo test --locked --no-default-features --features openwrt config::parser::domain_rule::tests

  sdk:
    name: OpenWrt SDK (${{ matrix.arch }})
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a15_neon-vfpv4
          - i386_pentium4
          - mips_24kc
          - mipsel_24kc
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set monotonic package revision
        shell: bash
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" contrib/openwrt/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" contrib/openwrt/luci-app-smartdns-rs/Makefile

      - name: Build packages
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_LOG: 1
          NO_REFRESH_CHECK: 1
          PACKAGES: smartdns-rs luci-app-smartdns-rs
          V: s

      - name: Upload packages and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}-${{ github.sha }}
          path: |
            bin/packages/**/*.apk
            bin/packages/**/*.ipk
            logs/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish OpenWrt release
    needs:
      - contract
      - sdk
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*-${{ github.sha }}
          path: artifacts

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          while IFS= read -r -d '' package; do
            name="$(basename "$package")"
            if [[ "$name" == *_all.ipk || "$name" == *-all.apk ]]; then
              test -e "release/$name" || cp "$package" "release/$name"
            else
              cp "$package" "release/$name"
            fi
          done < <(find artifacts -type f \( -name '*.ipk' -o -name '*.apk' \) -print0)
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          (cd release && sha256sum * | sort -k2 > SHA256SUMS)
          printf '%s\n' \
            "Source commit: $GITHUB_SHA" \
            "OpenWrt architectures: aarch64_cortex-a53, aarch64_cortex-a72, aarch64_generic, arm_cortex-a7_neon-vfpv4, arm_cortex-a15_neon-vfpv4, i386_pentium4, mips_24kc, mipsel_24kc, x86_64" \
            "Install the package format accepted by your firmware (IPK for opkg or APK for apk)." \
            > release-notes.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.contract.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="openwrt-v${VERSION}-r${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "SmartDNS-rs OpenWrt v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file release-notes.txt \
              --latest
          fi
